<!--
  HF SHARED HEADER — componente homogéneo (azul marino + logo oficial HorFin).
  Autocontenido y con CSS aislado (.hf-bar). Puramente ADITIVO: se inserta tras
  <body>. Mantener idéntico en todas las herramientas.
  Fondo azul marino #003A75; logo oficial blanco de Horizonte Financiero.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600&display=swap">
<style>
.hf-bar{box-sizing:border-box;position:sticky;top:0;z-index:99999;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 22px;background:#003A75;background:linear-gradient(180deg,#003A75,#00305F);border-bottom:1px solid rgba(255,255,255,0.10);font-family:"Epilogue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.hf-bar *{box-sizing:border-box;}
.hf-bar__brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;min-width:0;}
.hf-bar__logo{height:26px;width:auto;display:block;flex:0 0 auto;}
.hf-bar__sub{font-size:12px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.72);padding-left:12px;border-left:1px solid rgba(255,255,255,0.22);white-space:nowrap;}
.hf-bar__back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;text-decoration:none;color:#fff;padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.28);background:rgba(255,255,255,0.06);transition:background .15s,border-color .15s;white-space:nowrap;}
.hf-bar__back:hover{background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.5);}
@media (max-width:560px){.hf-bar{padding:9px 14px;}.hf-bar__sub{display:none;}.hf-bar__back-label{display:none;}.hf-bar__back{padding:7px 10px;}}
</style>
<header class="hf-bar">
<a class="hf-bar__brand" href="https://tool.rafagdominguez96.workers.dev/" aria-label="Horizonte Financiero - Herramientas">
<img class="hf-bar__logo" src="https://horizontefinancieroasesores.com/wp-content/uploads/2025/03/Logotipo_Horizonte_Financiero-1_White-1024x259.png" alt="Horizonte Financiero">
<span class="hf-bar__sub">Herramientas</span></a>
<a class="hf-bar__back" href="https://tool.rafagdominguez96.workers.dev/"><span>&larr;</span> <span class="hf-bar__back-label">Todas las herramientas</span></a>
</header>
