name: Supabase Keepalive

# Evita que los proyectos Supabase (free tier) se auto-pausen por inactividad >7d.
# Corre a diario EN LA NUBE (independiente de que tu PC esté encendido).
# AUTÓNOMO: solo hace pings REST, no depende del código del repo.
#
# Mantiene vivos DOS proyectos:
#   - fund-analyzer   (SUPABASE_URL    / SUPABASE_ANON_KEY)
#   - fund-dashboard  (SUPABASE_URL_2  / SUPABASE_ANON_KEY_2)
#
# REQUISITOS:
#   1. Debe estar en la rama por defecto (main) para que el cron se dispare.
#   2. Secrets en Settings → Secrets and variables → Actions (ya configurados via API).

on:
  schedule:
    - cron: "0 8 * * *"      # cada día a las 08:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping proyectos Supabase (best-effort por proyecto)
        env:
          URL1: ${{ secrets.SUPABASE_URL }}
          KEY1: ${{ secrets.SUPABASE_ANON_KEY }}
          URL2: ${{ secrets.SUPABASE_URL_2 }}
          KEY2: ${{ secrets.SUPABASE_ANON_KEY_2 }}
        run: |
          ping() {
            local name="$1" url="$2" key="$3"
            if [ -z "$url" ] || [ -z "$key" ]; then echo "[$name] sin secrets, skip"; return 0; fi
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
              "$url/rest/v1/funds?select=isin&limit=1" \
              -H "apikey: $key" -H "Authorization: Bearer $key" || echo "000")
            echo "[$name] HTTP $code"
            if [ "$code" = "200" ]; then echo "[$name] OK (activo)"; else echo "[$name] aviso: no respondió 200 (¿pausado? requiere restaurar a mano)"; fi
          }
          ping "fund-analyzer"  "$URL1" "$KEY1"
          ping "fund-dashboard" "$URL2" "$KEY2"
          # El job no falla aunque un proyecto esté pausado: un ping no puede
          # restaurarlo, y no queremos que la Action salga en rojo por eso.
          echo "keepalive completado"
