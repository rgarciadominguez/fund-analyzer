name: Supabase Keepalive

# Evita que Supabase (free tier) auto-pause el proyecto por inactividad >7 días.
# Corre a diario EN LA NUBE (independiente de que tu PC esté encendido).
# Es AUTÓNOMO: solo hace un ping REST, no depende del código del repo.
#
# REQUISITOS:
#   1. Debe estar en la RAMA POR DEFECTO (main). Los cron de Actions solo se
#      disparan desde la default branch.
#   2. Añadir 2 secrets en Settings → Secrets and variables → Actions:
#        - SUPABASE_URL        (ej. https://mfbtebngddjjuwfaelat.supabase.co)
#        - SUPABASE_ANON_KEY   (la anon key del .env)

on:
  schedule:
    - cron: "0 8 * * *"      # cada día a las 08:00 UTC
  workflow_dispatch: {}        # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (registra actividad)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/funds?select=isin&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST respondió HTTP $code"
          test "$code" = "200"
